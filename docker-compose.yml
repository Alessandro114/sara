services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      # Must be set in .env — no insecure default shipped here. Compose fails
      # fast with a clear error if POSTGRES_PASSWORD is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sara
    # No host port mapping: only the sara/waha containers on sara-net need
    # Postgres, and pgAdmin/psql from the host can still connect via
    # `docker compose exec postgres psql -U postgres` if you need to.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # WAHA generates a random API key on every boot if this isn't set
      # explicitly, and there's no way for the sara container to learn it —
      # so both containers must read the SAME value from .env, not just sara.
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "true"
    ports:
      - "3004:3000"
    networks:
      - sara-net

  sara:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - .env
    environment:
      # Hard-set to the in-network service names, overriding whatever
      # .env says — a fresh .env.example still says localhost/127.0.0.1,
      # which only makes sense outside Docker. Inside this network the
      # containers must address each other by service name. Password comes
      # from the same POSTGRES_PASSWORD used by the postgres service above.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sara
      WAHA_API_URL: http://waha:3000
      WAHA_WEBHOOK_URL: http://sara:3006/api/waha-webhook
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    networks:
      - sara-net

networks:
  sara-net:
    driver: bridge

volumes:
  postgres_data:
