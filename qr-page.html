<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>SARA · Pairing WhatsApp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1f3a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;color:#0f172a;border-radius:18px;padding:28px 28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);width:330px}
  h1{font-size:19px;margin:0 0 4px;color:#0b1f3a}
  .sub{font-size:12.5px;color:#64748b;margin-bottom:18px}
  #qr{display:flex;justify-content:center;min-height:256px;align-items:center}
  #qr img,#qr canvas{border-radius:8px}
  .status{margin-top:16px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px}
  .waiting{background:#eff6ff;color:#2563eb}
  .stale{background:#fef9c3;color:#854d0e}
  .ok{background:#dcfce7;color:#166534}
  .meta{font-size:11px;color:#94a3b8;margin-top:10px}
  .spin{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <h1>📲 SARA · Pairing</h1>
    <div class="sub">Apri WhatsApp → Dispositivi collegati → Collega un dispositivo → inquadra il QR</div>
    <div id="qr"><div class="spin"></div></div>
    <div id="status" class="status waiting">In attesa del codice…</div>
    <div class="meta" id="meta"></div>
  </div>
<script>
  var qrBox = document.getElementById('qr');
  var statusEl = document.getElementById('status');
  var metaEl = document.getElementById('meta');
  var last = '';
  var lastChange = Date.now();
  var qrObj = null;

  function render(text){
    qrBox.innerHTML = '';
    qrObj = new QRCode(qrBox, { text: text, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.L });
  }

  async function tick(){
    try{
      var r = await fetch('/sara-qr/data?t=' + Date.now(), { cache: 'no-store' });
      var txt = (await r.text()).trim();
      if(txt && txt.length > 20){
        if(txt !== last){ last = txt; lastChange = Date.now(); render(txt); }
        var age = Math.round((Date.now() - lastChange)/1000);
        if(age < 60){
          statusEl.className = 'status waiting';
          statusEl.textContent = 'Codice attivo — inquadralo ora';
        } else {
          statusEl.className = 'status stale';
          statusEl.textContent = 'Codice scaduto (' + age + 's). Se SARA non è connessa, ricarica.';
        }
        metaEl.textContent = 'Ultimo QR: ' + age + 's fa · si rigenera in automatico';
      } else {
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Nessun QR in attesa — SARA risulta connessa';
        metaEl.textContent = 'Se invece non funziona, ricarica la pagina.';
      }
    }catch(e){
      metaEl.textContent = 'errore lettura: ' + e;
    }
  }
  tick();
  setInterval(tick, 3000);
</script>
</body>
</html>
