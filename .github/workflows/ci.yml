name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # La copertura si MISURA a ogni giro. Prima non si misurava affatto, e
      # in mancanza del numero si citava il rapporto fra righe di test e righe
      # di codice (3,8%) come se fosse copertura: la copertura vera e il 56%.
      # Due misure diverse, e quella grezza faceva sembrare il progetto messo
      # molto peggio di com e.
      - name: Test e copertura
        run: npm run test:coverage
