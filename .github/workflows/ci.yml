name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # A fresh, disposable Postgres instance that lasts only for the job.
    #
    # This is needed because most of the uncovered code talks to the
    # database — db.ts was at 6.7%, persistent-memory at 27% — not because
    # it's neglected code: in testing there had never been a database to
    # talk to.
    #
    # The alternative would be to mock the `pg` module, but then the tests
    # would just be verifying the mocks. Here the REAL code runs against a
    # real database, and ensureMemorySchema() creates its own tables.
    services:
      postgres:
        # pgvector, not plain postgres: db.ts's initDB() starts with
        # CREATE EXTENSION vector, because the knowledge table stores
        # embeddings as vector(1024). With postgres:15, initDB fails on the
        # very first line — which is exactly the case db.ts's error message
        # explains ("Use the pgvector/pgvector image").
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: sara
          POSTGRES_DB: sara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sara:sara@127.0.0.1:5432/sara_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Tests run on BOTH Node versions: that's the whole reason the matrix
      # exists.
      - name: Test
        if: matrix.node != '20'
        run: bash scripts/run-tests.sh

      # Coverage is MEASURED on a single version, and it's worth explaining
      # why.
      #
      # Until 08/29 it ran on both, and gave two different numbers for the
      # same code: 64.69% on Node 20 and 60.34% on Node 22. It's not that
      # something gets skipped on 22 — 16 and 16 tests, zero skipped on
      # either — it's that c8 reads coverage from V8, and Node 22's V8
      # attributes lines differently than Node 20's does. Same code, same
      # tests, a 429-line gap.
      #
      # Two numbers for the same thing isn't a measurement: it's a number
      # that depends on which job you look at. We measure on Node 20, which
      # is what the Dockerfile uses (node:20-alpine) and therefore what
      # actually runs in production, so the number stays comparable over
      # time and reflects the real version.
      - name: Test and coverage
        if: matrix.node == '20'
        run: npm run test:coverage
