name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # Un Postgres vuoto e usa-e-getta, che dura quanto il job.
    #
    # Serve perche il grosso del codice non coperto parla al database — db.ts
    # era al 6,7%, persistent-memory al 27% — e non perche sia codice
    # trascurato: in prova non c'era mai stato un database a cui parlare.
    #
    # L'alternativa sarebbe rattoppare il modulo `pg` con dei finti, ma quei
    # test verificherebbero i finti. Qui gira il codice VERO contro un
    # database vero, e ensureMemorySchema() si crea le tabelle da solo.
    services:
      postgres:
        # pgvector, non postgres semplice: initDB() di db.ts apre con
        # CREATE EXTENSION vector, perche la tabella della conoscenza tiene gli
        # embedding come vector(1024). Con postgres:15 initDB fallisce alla
        # prima riga — ed e proprio il caso che il messaggio d'errore di db.ts
        # spiega ("Use the pgvector/pgvector image").
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: sara
          POSTGRES_DB: sara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sara:sara@127.0.0.1:5432/sara_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # La copertura si MISURA a ogni giro. Prima non si misurava affatto, e
      # in mancanza del numero si citava il rapporto fra righe di test e righe
      # di codice (3,8%) come se fosse copertura: la copertura vera e il 56%.
      # Due misure diverse, e quella grezza faceva sembrare il progetto messo
      # molto peggio di com e.
      - name: Test e copertura
        run: npm run test:coverage
