name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # Un Postgres vuoto e usa-e-getta, che dura quanto il job.
    #
    # Serve perche il grosso del codice non coperto parla al database — db.ts
    # era al 6,7%, persistent-memory al 27% — e non perche sia codice
    # trascurato: in prova non c'era mai stato un database a cui parlare.
    #
    # L'alternativa sarebbe rattoppare il modulo `pg` con dei finti, ma quei
    # test verificherebbero i finti. Qui gira il codice VERO contro un
    # database vero, e ensureMemorySchema() si crea le tabelle da solo.
    services:
      postgres:
        # pgvector, non postgres semplice: initDB() di db.ts apre con
        # CREATE EXTENSION vector, perche la tabella della conoscenza tiene gli
        # embedding come vector(1024). Con postgres:15 initDB fallisce alla
        # prima riga — ed e proprio il caso che il messaggio d'errore di db.ts
        # spiega ("Use the pgvector/pgvector image").
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: sara
          POSTGRES_DB: sara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://sara:sara@127.0.0.1:5432/sara_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # I test girano su TUTTE E DUE le versioni di Node: e il motivo per cui
      # la matrice esiste.
      - name: Test
        if: matrix.node != '20'
        run: bash scripts/run-tests.sh

      # La copertura si MISURA su una sola versione, e va spiegato perche.
      #
      # Fino al 29/08 girava su entrambe, e dava due numeri diversi per lo
      # stesso codice: 64,69% su Node 20 e 60,34% su Node 22. Non e che su 22
      # si saltasse qualcosa — i test sono 16 e 16, zero saltati su tutte e due
      # — e' che c8 legge la copertura da V8, e V8 di Node 22 attribuisce le
      # righe in modo diverso da quello di Node 20. Stesso codice, stessi test,
      # 429 righe di scarto.
      #
      # Due numeri per la stessa cosa non sono una misura: sono un numero che
      # dipende da quale job si guarda. Si misura su Node 20, che e quello del
      # Dockerfile (node:20-alpine) e quindi quello che gira davvero, e cosi il
      # numero e confrontabile nel tempo e riferito alla versione vera.
      - name: Test e copertura
        if: matrix.node == '20'
        run: npm run test:coverage
