<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta name="robots" content="noindex"><title>SARA · QR</title>
<style>body{background:#0b1f3a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui;color:#fff}.card{background:#fff;border-radius:18px;padding:28px;text-align:center;max-width:400px}img{width:300px;height:300px;border-radius:8px}h2{color:#0b1f3a;margin:0 0 4px;font-size:19px}p{color:#64748b;font-size:13px;margin:4px 0 16px}.st{font-size:12px;color:#2563eb;margin-top:8px}</style></head>
<body><div class="card"><h2>📲 SARA · Pairing</h2>
<p>WhatsApp → Dispositivi collegati → Collega → inquadra</p>
<img id="qr" src="/waha-qr">
<div class="st" id="st">Caricamento...</div></div>
<script>
var qr=document.getElementById("qr"),st=document.getElementById("st");
function refresh(){qr.src="/waha-qr?t="+Date.now();st.textContent="Aggiornato: "+new Date().toLocaleTimeString()}
qr.onerror=function(){st.textContent="QR scaduto — ricarico...";setTimeout(refresh,2000)};
qr.onload=function(){st.textContent="QR attivo — inquadra ora!"};
setInterval(refresh,8000); refresh();
</script></body></html>
